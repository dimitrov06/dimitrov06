# Copy to config.yaml. Secrets go in .env, never here.

mode: record            # record | paper | live
broker: mt5             # mt5 (IC Markets MetaTrader 5) | oanda

mt5:
  # parser instrument -> IC Markets symbol. Anything not listed: XAU_USD -> XAUUSD, EUR_USD -> EURUSD
  symbol_map:
    US30_USD: US30
    NAS100_USD: USTEC
    SPX500_USD: US500
    DE30_EUR: DE40
    UK100_GBP: UK100
    WTICO_USD: XTIUSD
    BCO_USD: XBRUSD
  symbol_suffix: ""     # set if your account's symbols have a suffix
  magic: 770077         # marks the bot's positions in MT5
  deviation_points: 20  # max slippage on market orders, in points

telegram:
  channels:             # @username, numeric id (-100...) or the group name as shown in Telegram
    - "@example_signals"
  session_name: signal_copier
  session_dir: data       # Telethon session file lives here (keep it secret, it is your login)

parser:
  rules_file: null      # null = built-in src/signal_copier/parser/rules.yaml
  # How to treat "XAUUSD BUY 2345" (price/zone without LIMIT/STOP word):
  # market = open at market now, the price is only a reference for risk checks
  bare_price_entry: market   # market | limit
  max_price_deviation_pct: 10   # SL/TP further than this from entry => not confident

risk:
  risk_per_trade_pct: 0.5
  max_open_positions: 5
  max_positions_per_symbol: 2
  daily_loss_limit_pct: 2.0
  max_entry_slippage_sl_fraction: 0.3   # reject if price moved > 30% of SL distance
  max_signal_age_seconds: 60
  max_spread:                            # in price units, keyed by parser instrument name
    XAU_USD: 0.50
    EUR_USD: 0.00025
    US30_USD: 4.0
    NAS100_USD: 2.5
  default_max_spread_sl_fraction: 0.15  # fallback: spread <= 15% of SL distance

executor:
  tp_split: last        # last = one trade, TP = last TP (RTED manual: TP2 is the target, TP1 is only watched)
                        # equal = one trade per TP, size split equally
  retry_attempts: 4
  retry_base_delay_s: 1.0
  request_timeout_s: 10
  pending_order_expiry_minutes: 240   # LIMIT/STOP orders expire after this
  follow_up_symbol_lookback_hours: 24 # "AUDUSD close" without reply -> latest AUDUSD signal in this window
  monitor_interval_s: 30              # how often closed trades / filled limits are checked

storage:
  sqlite_path: data/signal_copier.sqlite

logging:
  level: INFO
  json: true
