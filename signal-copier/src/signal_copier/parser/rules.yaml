# Parser rules. Text is normalized before matching: NFKC, UPPERCASE,
# emojis removed (except emoji_replacements), "XAU/USD" -> "XAUUSD",
# thousands separators removed ("2,345.50" -> "2345.50").
# All patterns are Python regexes matched against that normalized text.
# Use (?P<price>...) / (?P<percent>...) / (?P<tp>...) named groups where noted.
# Command patterns (follow_ups and everything after them) are compiled with re.MULTILINE (^ and $ match at each
# line) and may use {NAME} for an entry of `macros`; {SYMBOL} is any alias of `symbols` or an FX pair.

emoji_replacements:
  "✅": " HIT "
  "🎯": " HIT "

# Alias -> OANDA instrument. Longest alias wins; matched as a whole word.
symbols:
  GOLD: XAU_USD
  XAUUSD: XAU_USD
  XAU: XAU_USD
  SILVER: XAG_USD
  XAGUSD: XAG_USD
  US30: US30_USD
  DJ30: US30_USD
  DOW: US30_USD
  DOWJONES: US30_USD
  WS30: US30_USD
  NAS100: NAS100_USD
  NASDAQ: NAS100_USD
  US100: NAS100_USD
  USTEC: NAS100_USD
  NQ: NAS100_USD
  SPX500: SPX500_USD
  US500: SPX500_USD
  SP500: SPX500_USD
  GER40: DE30_EUR
  GER30: DE30_EUR
  DE40: DE30_EUR
  DAX: DE30_EUR
  UK100: UK100_GBP
  USOIL: WTICO_USD
  WTI: WTICO_USD
  OIL: WTICO_USD
  UKOIL: BCO_USD
  BRENT: BCO_USD
  BTCUSD: BTC_USD   # OANDA crypto CFDs are not available in every region
  BTC: BTC_USD

# Any 6-letter pair of these currencies maps to AAA_BBB (EURUSD -> EUR_USD).
fx_currencies: [EUR, USD, GBP, JPY, CHF, AUD, NZD, CAD, SGD, HKD, NOK, SEK, PLN, ZAR, MXN, TRY, CZK, HUF, DKK, CNH]

side:
  BUY: ['\bBUY\b', '\bLONG\b']
  SELL: ['\bSELL\b', '\bSHORT\b']

pending_order:            # "BUY LIMIT", "Sell Stop Order", "Buy-Stop", "Buy (Stop Order)", "Stop Buy Order"
  LIMIT: ['\b(?:BUY|SELL)[ \t\-:,(]*(?:PENDING[ \t]+)?LIMIT\b', '\bLIMIT[ \t\-:,(]*(?:BUY|SELL)\b']
  STOP: ['\b(?:BUY|SELL)[ \t\-:,(]*(?:PENDING[ \t]+)?STOP\b(?![ \t\-]*LOSS)', '\bSTOP[ \t\-:,(]*(?:BUY|SELL)\b']
# The entry line (a line with BUY/SELL or "@", before any SL/TP) names an order type that pending_order does not
# recognise ("Buy Stp Order", "Sell Limt Order", "Buy Stop Limit", "Buy Order @"): the signal is UNCERTAIN, it is
# never taken at market. ORDER alone counts only when no market word is there ("Buy Market Order" is a market order).
pending_hint: '\b(?:LIMIT|LIMT|LMT|STP|SOTP|STPO|PENDING)\b|\bSTOP\b(?![ \t\-]*LOSS)'
order_word: '\bORDERS?\b'

market_words: ['\bNOW\b', '\bMARKET\b', '\bCMP\b', '\bINSTANT\b', '\bEXECUTION\b']

# Entry keyword; matched per line, the price/zone must follow on the same line.
entry: '(?:\bENTRY(?:[ \t]+PRICE)?|\bENTER\b|\bOPEN(?:[ \t]+PRICE)?\b|\bPRICE\b|@)[ \t]*[:=@\-]?[ \t]*'
sl: '\b(?:SL|S/L|STOP[ \t]*LOSS|STOPLOSS)\b[ \t]*[:=@\-]?[ \t]*(?P<price>\d+(?:\.\d+)?)'
# TP keyword (optionally numbered TP1/TP2). Numbers after it until the next keyword are TPs.
tp_keyword: '\b(?:TP|T/P|TAKE[ \t]*PROFIT|TARGET(?:[ \t]*PROFIT)?)(?:[ \t]*\d(?![\d.]))?(?![A-Z])[ \t]*[:=@\-]?'
# Noise removed from TP/SL lines before reading numbers.
noise: ['\([^)]*\)', '[+\-]?\d+(?:\.\d+)?\s*(?:PIPS?|POINTS?|PTS|%)', '\bRR\s*\d+\s*:\s*\d+']

macros:
  PRICE: '(?P<price>\d+(?:\.\d+)?)(?![\d:])'
  # a partial size: "50%", "30 percent"; never a P/L note such as "(+1.43%)", "+0.8%" or "(43%)"
  PCT: '(?<![\d.+\-(])(?P<percent>\d{1,3})(?![\d.])\s*(?:%|PERCENT\b)'
  # the rest of the sentence up to "at <price>" / "@ <price>"
  BEFORE_PRICE: '(?:(?!\bAT\b|@)[^\n.!?;])*?'
  # the rest of the sentence ("Close now. Re-enter at 4470" is two sentences)
  IN_SENTENCE: '[^\n.!?;]*?'
  # what may stand before a command at the start of a line: "‼️", "XAUUSD", "TP1 hit ✅", "Please"
  LEAD: '^[^\w\n]*(?:(?:{SYMBOL}|PLEASE|NOW|WE|LET[’'']?S|GUYS|TP\s*\d|HIT)[^\w\n]*)*'
  # what may follow CLOSE/EXIT at the start of a line
  CLOSE_OBJ: '(?:NOW|ALL|IT|FULL|EVERYTHING|IMMEDIATELY|ASAP|MANUALLY|HERE|THE\s+TRADES?|THE\s+POSITIONS?|THIS\s+(?:TRADE|POSITION|ONE)|YOUR\s+(?:TRADES?|POSITIONS?)|TRADES?|POSITIONS?|ORDERS?|{SYMBOL})\b'
  # what makes CLOSE/EXIT a command anywhere in a sentence ("TP1 hit, close now")
  CLOSE_NOW: '(?:NOW|ALL|IT|EVERYTHING|IMMEDIATELY|ASAP|MANUALLY|THE\s+TRADES?|THE\s+POSITIONS?|THIS\s+(?:TRADE|POSITION)|YOUR\s+(?:TRADES?|POSITIONS?)|{SYMBOL})\b'
  # a command word ends the sentence, or is followed by its object or by "at <price>"
  CMD_END: '(?=[ \t]*(?:$|[!.,;:]|{CLOSE_OBJ}|(?:AT|@)[ \t]*\d))'

# Descriptive phrases that only look like commands ("very close to TP1", "weekly close above 4400", "exit strategy").
# They are blanked out before commands are looked for, so they never become CLOSE and never make a message unclear.
not_commands:
  - '\b(?:IS|ARE|AM|WAS|WERE|BE|BEEN|BEING|GETTING|GET|GOT|VERY|SO|PRETTY|QUITE|REALLY|TOO|SUPER)\s+CLOSE\b'
  - '\bCLOSE\s+(?:TO|ABOVE|BELOW|UNDER|OVER|ENOUGH|BY|CALL)\b'
  - '\b(?:DAILY|WEEKLY|MONTHLY|YEARLY|MARKETS?|CANDLES?|DAY|SESSION|H1|H4|D1|W1|M15|M30|1H|4H|NY|LONDON|BAR)\s+CLOSES?\b'
  - '\bCLOSES?\s+OF\s+THE\s+(?:CANDLE|DAY|WEEK|MONTH|MARKET|SESSION)\b'
  - '\bEXIT\s+(?:STRATEGY|STRATEGIES|PLAN|POINTS?|LEVELS?|ZONE|TARGETS?|SIGNAL)\b'

# Follow-up commands. Checked in this order; a matched action can suppress others.
follow_ups:
  - action: CLOSE_PARTIAL
    patterns:
      # "Close AUDUSD 50% now", "close 30%": the size comes before the close price and is not a P/L ("14% profit")
      - '\b(?:CLOSE|EXIT)\b{BEFORE_PRICE}{PCT}(?![ \t]*(?:PROFIT|GAIN|LOSS|UP|DOWN|ROI|RETURN)\b)'
      - '\b(?:TAKE|SECURE|BOOK)\s+(?:PROFIT\s+(?:ON\s+|OF\s+)?)?{PCT}'      # "Secure 50% profit on XAUUSD"
      - '\b(?:CLOSE|EXIT)\b{BEFORE_PRICE}\b(?:HALF|PARTIAL(?:LY)?|PARTIALS|1\s*/\s*2)\b'  # "Close AUDUSD partially at x"
      - '\b(?:PARTIAL(?:LY)?|HALF)\s+(?:CLOSE|CLOSING|EXIT)\b'             # "Partially close AUDUSD now"
      - '\b(?:TAKE|SECURE|BOOK)\s+(?:SOME\s+)?(?:PARTIALS?|HALF)\b'
    default_fraction: 0.5
    suppresses: [CLOSE]
  - action: MOVE_SL_BE
    patterns:
      - '\b(?:MOVE|SET|PUT|SHIFT)\s+(?:THE\s+)?(?:SL|STOP\s*LOSS|STOP)\s+(?:TO\s+)?(?:BE|B/E|BREAK\s*EVEN|ENTRY)\b'
      - '\b(?:SL|STOP\s*LOSS)\s+(?:TO\s+|AT\s+)?(?:BE|B/E|BREAK\s*EVEN|ENTRY)\b'
      - '\b(?:MOVE|SET|PUT|SHIFT)\s+(?:IT\s+|THE\s+TRADES?\s+|TRADES?\s+|POSITIONS?\s+|EVERYTHING\s+)?(?:TO|AT|ON)\s+(?:BE|B/E|BREAK\s*EVEN)\b'
      # a line that is only "Breakeven now" / "TP1 hit ✅ Break even" (the bare words elsewhere are not a command)
      - '^[^\w\n]*(?:(?:{SYMBOL}|TP\s*\d|HIT|NOW)[^\w\n]*)*(?:BREAK\s*EVEN|B/E)(?:[ \t]+NOW)?[^\w\n]*$'
    suppresses: [MOVE_SL]
  - action: MOVE_SL
    # the number must be a price: "20 pips", "1:1", "50%", "1.5R", "30 in profit" are not (see unclear below)
    patterns:
      - '\b(?:MOVE|SET|PUT|SHIFT)\s+(?:THE\s+)?(?:SL|STOP\s*LOSS|STOP)\s+(?:TO\s+|AT\s+)?(?P<price>\d+(?:\.\d+)?)(?!\d|\.\d|\s*(?:PIPS?\b|POINTS?\b|PTS\b|%|R\b|RR\b|:|\$)|\s+(?:IN\s+)?PROFIT)'
      - '\bNEW\s+(?:SL|STOP\s*LOSS)\s*[:=@\-]?\s*(?P<price>\d+(?:\.\d+)?)(?!\d|\.\d|\s*(?:PIPS?\b|POINTS?\b|PTS\b|%|R\b|RR\b|:|\$)|\s+(?:IN\s+)?PROFIT)'
  - action: TP_HIT
    patterns:
      - '\bTP\s*(?P<tp>\d)\s*(?:IS\s+)?(?:HIT|DONE|REACHED|SMASHED)\b'
  - action: SL_HIT
    patterns:
      - '\b(?:SL|STOP\s*LOSS)\s+(?:IS\s+)?(?:HIT|TAKEN)\b'
      - '\bSTOPPED\s+OUT\b'
  - action: CANCEL
    patterns:
      - '\bCANCEL(?:L?ED)?\b'
      - '\b(?:DELETE|REMOVE)\s+(?:THE\s+)?(?:ORDER|LIMIT|PENDING)\b'
  - action: CLOSE
    # a command form only: at the start of a line ("‼️ Close AUDUSD Manually now at 0.69530!", "XAUUSD close now",
    # "Close all") or with its object ("TP1 hit, close now"). "close to TP1", "don't close", "exit strategy" are not.
    patterns:
      # price = the channel's close price (for record-mode stats)
      - '{LEAD}(?:CLOSE|EXIT)\b{CMD_END}{IN_SENTENCE}(?:\bAT|@)[ \t]*{PRICE}'
      - '\b(?:CLOSE|EXIT)[ \t]+{CLOSE_NOW}{IN_SENTENCE}(?:\bAT|@)[ \t]*{PRICE}'
      - '{LEAD}(?:CLOSE|EXIT)\b{CMD_END}'
      - '\b(?:CLOSE|EXIT)[ \t]+{CLOSE_NOW}'

# Checked for every command except TP_HIT/SL_HIT, in the part of the message it is written in. A command caught by
# one of them is not carried out: the message is UNCERTAIN and the owner is told (inside a signal post: left out).
command_guards:
  # before the command in the same clause: "Don't close yet", "Do not cancel your order"
  negation: '\b(?:DON[’'']?T|DONT|DO\s+NOT|DOESN[’'']?T|DOES\s+NOT|NOT|NEVER|NO|NO\s+NEED\s+TO|AVOID|WITHOUT)\b'
  # before the command in the same clause, a plan or an opinion: "We will move SL to BE", "you may close"
  modal: '\b(?:WILL|WOULD|COULD|MIGHT|MAY|SHOULD|CAN|SHALL|GOING\s+TO|GONNA|PLAN(?:NING)?\s+TO|WANT\s+TO|THINK)\b|[’'']LL\b'
  # anywhere in the same sentence: "move SL to BE once TP1 is hit", "close half at TP1", "if price reaches 4150, cancel"
  condition: '\b(?:IF|ONCE|WHEN|WHENEVER|UNTIL|UNLESS|IN\s+CASE|LATER|TOMORROW|TONIGHT)\b|\b(?:AT|AFTER|BEFORE|ON|NEAR)\s+(?:THE\s+)?(?:TP|T/P|TARGET|TAKE\s*PROFIT)(?![A-Z])'

# Words of a command. In a message without a signal, one that is not part of a recognised command (and not negated)
# makes the message UNCERTAIN: "Closing XAUUSD", "Close call", "Gold could break even higher".
command_words: ['\bCLOS(?:E|ING)\b', '\bEXIT(?:ING)?\b', '\bCANCEL\w*', '\bBREAK\s*EVEN\b', '\bB/E\b']

# Reports of what already happened to a trade. A NEW post with a whole signal and one of these (a repost
# "...Closed manually at 4478 ❌", a cancel that quotes the order) is UNCERTAIN instead of a new trade.
results: ['\b(?:CLOSED|CANCELL?ED|STOPPED\s+OUT|EXPIRED|DELETED|REMOVED|INVALIDATED)\b']
# Words of an update about a running trade ("XAUUSD Buy - Update the Stop Loss @ x", "Gold buy running, new SL").
# A block with them is never a new signal unless it has an entry line; a new post with an entry line and them is UNCERTAIN.
update_words: ['\b(?:UPDATE[SD]?|MOVED|RUNNING|REACHED|SECURED|BOOKED|IN\s+PROFIT|RISK[ \t\-]*FREE)\b']

# A stop-loss command whose number is a distance, a ratio or a percentage, not a price
# ("move SL to 20 pips in profit", "SL to 1:1", "set SL at 50%", "SL to entry +5 pips"): the message is UNCERTAIN.
unclear:
  - '\b(?:MOVE|SET|PUT|SHIFT|TRAIL|UPDATE|CHANGE|NEW)\b[^\n]*?\b(?:SL|S/L|STOP\s*LOSS|STOPLOSS|STOP)\b\s*(?:TO\s+|AT\s+|[:=@\-]\s*)?[+\-]?\d+(?:\.\d+)?\s*(?:PIPS?\b|POINTS?\b|PTS\b|%|R\b|RR\b|:\s*\d|\$|IN\s+PROFIT\b|PROFIT\b|ABOVE\b|BELOW\b|FROM\b|AWAY\b)'
  - '\b(?:SL|S/L|STOP\s*LOSS|STOPLOSS)\s+(?:TO|AT)\s+[+\-]?\d+(?:\.\d+)?\s*(?:PIPS?\b|POINTS?\b|PTS\b|%|R\b|RR\b|:\s*\d|IN\s+PROFIT\b|PROFIT\b)'
  - '\b(?:SL|S/L|STOP\s*LOSS|STOPLOSS|STOP)\b[^\n]*?\b(?:BE|B/E|BREAK\s*EVEN|ENTRY)\s*(?:[+\-]|PLUS\b|MINUS\b)\s*\d'
